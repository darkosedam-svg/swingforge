[project]
name = "swingforge"
version = "0.1.0"
description = "Swing-trading research and paper-trading system (Daily bias / 4H execution)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "duckdb>=1.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "hyperliquid-python-sdk>=0.9",
    "oandapyV20>=0.7",
    "python-dotenv>=1.0",
    "six>=1.17.0",
    "pandas>=3.0.5",
]

[project.scripts]
swingforge = "swingforge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "vcrpy>=6.0",
    "import-linter>=2.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swingforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running test, excluded from the fast unit loop",
    "contract: hits (or replays via vcrpy) a real venue API",
]
filterwarnings = [
    "error",
    "default::DeprecationWarning",
    "default::PendingDeprecationWarning",
    "default::ResourceWarning",
    "default::RuntimeWarning",
    "default::SyntaxWarning",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff]
line-length = 110
target-version = "py312"
# docs/superpowers/reference holds vendored porting references, not project code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["swingforge"]
